:root{
  --bg:#F4F3F0; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#5E5E5E; --line:#E8E6E0;
  --track:#E0E3E8; --track-stripe:#F0F2F4; --tile:#0A0A0A; --tile-ink:#FFFFFF;
  --blue:#5374CF; --blue-deep:#2A50B8; --mint:#99E2BF; --coral:#FFBAA4; --lightblue:#A0DDED;
  --yellow:#F5EFAD; --warn-bg:#FFE6DC; --warn-ink:#6B2A14; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --surface:#1B1D21; --ink:#F4F3F0; --muted:#A8ABB2; --line:#2C2F35;
    --track:#262A31; --track-stripe:#1F2228; --tile:#000000; --tile-ink:#FFFFFF;
    --warn-bg:#3A231B; --warn-ink:#FFD5C6; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1B1D21; --ink:#F4F3F0; --muted:#A8ABB2; --line:#2C2F35;
  --track:#262A31; --track-stripe:#1F2228; --tile:#000000; --tile-ink:#FFFFFF;
  --warn-bg:#3A231B; --warn-ink:#FFD5C6; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Roobert','Inter','Helvetica Neue',Helvetica,sans-serif;font-weight:400;line-height:1.4}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{font-weight:600;margin:0;letter-spacing:-.01em}
.num{font-weight:800;font-variant-numeric:tabular-nums}

/* Carnival awning */
.awning{height:34px;background:
  radial-gradient(circle at 50% 0,transparent 15px,var(--bg) 16px) 0 18px/32px 32px repeat-x,
  repeating-linear-gradient(90deg,var(--blue) 0 32px,var(--surface) 32px 64px);}
header{padding:18px 0 8px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.logo{height:24px;width:auto;color:var(--ink);display:block;margin-bottom:14px}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
h1{font-size:clamp(30px,6vw,48px);line-height:1.02;margin-top:4px}
h1 .wiggle{display:inline-block;color:var(--blue)}
.tagline{color:var(--muted);margin-top:6px;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip b{font-weight:600}
select{font:inherit;font-weight:600;font-size:15px;color:var(--ink);background:var(--surface);
  border:2px solid var(--blue);border-radius:10px;padding:8px 34px 8px 12px;appearance:none;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--blue) 50%),linear-gradient(135deg,var(--blue) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.conf-name{font-weight:600;font-size:17px}

.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;margin:16px 0 0;font-size:14px}
.warn b{font-weight:600}
.warn ul{margin:6px 0 0;padding-left:18px}

section{margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-head h2{font-size:20px}
.sec-head p{margin:0;color:var(--muted);font-size:13px}

/* Race board */
.board{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px 16px 10px;position:relative;
  border:3px solid var(--tile)}
.bulbs{position:absolute;left:10px;right:10px;top:-7px;height:10px;
  background:radial-gradient(circle,var(--yellow) 3px,transparent 4px) 0 0/22px 10px repeat-x}
.bulbs.bottom{top:auto;bottom:-7px}
.board.go .bulbs{animation:blink .5s steps(2) 6}
@keyframes blink{50%{filter:brightness(.55)}}
.lane{display:grid;grid-template-columns:minmax(110px,170px) 1fr 54px;gap:10px;align-items:center;padding:5px 0}
.lane + .lane{border-top:1px dashed var(--line)}
.lane .who{display:flex;gap:8px;align-items:center;min-width:0;font-size:14px}
.lane .who .r{font-weight:800;color:var(--muted);min-width:1.6em;text-align:right}
.lane .who .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lane .pts{text-align:right;font-size:15px}
.track{position:relative;height:46px;border-radius:10px;
  background:repeating-linear-gradient(90deg,var(--track) 0 28px,var(--track-stripe) 28px 56px)}
.finish{position:absolute;right:0;top:0;bottom:0;width:12px;border-radius:0 10px 10px 0;
  background:conic-gradient(var(--tile) 25%,#fff 0 50%,var(--tile) 0 75%,#fff 0) 0 0/12px 12px}
.target{position:absolute;left:6px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;
  background:radial-gradient(circle,var(--coral) 0 3px,#fff 3px 5px,var(--coral) 5px 7px,#fff 7px 9px)}
.squirt{position:absolute;left:24px;top:50%;height:3px;margin-top:-1.5px;width:0;opacity:0;
  background:repeating-linear-gradient(90deg,var(--lightblue) 0 6px,transparent 6px 10px);border-radius:2px}
.racing .squirt{opacity:1;width:60px;animation:spray .3s linear infinite}
@keyframes spray{to{background-position:10px 0}}
.capsid{position:absolute;top:50%;width:58px;height:46px;margin-top:-23px;left:calc(30px + var(--f,0) * (100% - 100px));transition:left var(--dur,1.8s) cubic-bezier(.3,.1,.25,1) var(--delay,0s)}
.board.reset .capsid{left:30px;transition:none}
.capsid svg{width:100%;height:100%;overflow:visible;display:block}
.racing .capsid svg{animation:gallop .28s ease-in-out infinite alternate}
@keyframes gallop{from{transform:translateY(-3px) rotate(-6deg)}to{transform:translateY(3px) rotate(5deg)}}
.capsid .tail{stroke-dasharray:4 3}
.racing .capsid .tail{animation:tail .4s linear infinite}
@keyframes tail{to{stroke-dashoffset:-14}}
.finished .capsid svg{animation:none}
.board-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:12px;flex-wrap:wrap}
button.again{font:inherit;font-weight:600;font-size:13px;color:var(--tile-ink);background:var(--blue);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
button.again:hover{background:var(--blue-deep)}
button.again:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

/* Podium */
.podium{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;max-width:640px;margin:0 auto;justify-items:center}
.slot{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;width:100%}
.slot.p1{grid-column:1 / -1}
/* A cell: lipid bilayer (dotted heads + outer ring), cytoplasm tint, nucleus, a few organelles, the AAV inside */
.cell{position:relative;width:min(100%,240px);aspect-ratio:1;border-radius:50%;margin:14px 0 8px;
  background:var(--surface);
  background:radial-gradient(circle at 70% 72%,color-mix(in srgb,var(--c) 30%,transparent) 0 13%,transparent 13.5%),
             radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--c) 10%,var(--surface)),color-mix(in srgb,var(--c) 24%,var(--surface)));
  border:5px dotted var(--c);box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--c),var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14%;
  animation:breathe 5s ease-in-out infinite}
.slot.p1 .cell{width:min(100%,300px)}
.cell::before,.cell::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--c) 45%,transparent)}
.cell::before{width:9%;height:5%;left:18%;top:62%;transform:rotate(-30deg)}
.cell::after{width:6%;height:6%;right:20%;top:24%}
@keyframes breathe{0%,100%{border-radius:50%}33%{border-radius:52% 48% 50% 50% / 49% 52% 48% 51%}66%{border-radius:48% 52% 51% 49% / 52% 48% 51% 49%}}
.medal{position:absolute;top:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
  background:var(--c);color:#0A0A0A;border-radius:999px;padding:4px 12px;letter-spacing:.02em;box-shadow:0 0 0 3px var(--bg)}
.cell .big-capsid{width:52%;aspect-ratio:64/52;position:relative;z-index:1;animation:drift 6s ease-in-out infinite}
.cell .big-capsid svg{width:100%;height:100%;overflow:visible;display:block}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(4%,6%) rotate(5deg)}}
.cell .nm{font-weight:600;font-size:clamp(14px,3.6vw,19px);margin-top:4px;overflow-wrap:anywhere;line-height:1.15;position:relative;z-index:1}
.slot.p1 .cell .nm{font-size:clamp(16px,4.4vw,22px)}
.cell .total{font-weight:800;font-size:clamp(26px,7vw,38px);line-height:1;margin-top:4px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.slot.p1 .cell .total{font-size:clamp(32px,9vw,48px)}
.cell .total small{font-size:.36em;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-left:3px}
.slot .quip{color:var(--muted);font-size:13px;min-height:1.3em}
.slot .bdl{font-size:12px;color:var(--muted);margin-top:2px;max-width:260px}
.slot .bdl b{color:var(--ink);font-weight:600}

/* Rest */
.rest{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;font-size:14px}
.row + .row{border-top:1px solid var(--line)}
.row .r{font-weight:800;color:var(--muted);text-align:right}
.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mini{display:block;font-weight:400;color:var(--muted);font-size:12px;white-space:normal}
.row .p{font-size:15px;text-align:right}
.row.zero .n{color:var(--muted)}
.empty-note{padding:14px;color:var(--muted);font-size:14px}

/* Awards */
.awards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.award{background:var(--tile);color:var(--tile-ink);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.award .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--a)}
.award .t{font-size:13px;opacity:.75;margin-top:2px}
.award .w{font-weight:600;font-size:17px;margin-top:10px;overflow-wrap:anywhere}
.award .v{color:var(--a);font-size:22px;margin-top:2px}
.award .ribbon{position:absolute;right:12px;top:12px;width:22px;height:30px;background:var(--a);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}

footer{margin-top:30px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
footer h3{font-size:14px;color:var(--ink);margin-bottom:6px}
footer ul{margin:0;padding-left:18px;columns:2;column-gap:28px}
footer li{break-inside:avoid;margin-bottom:2px}
footer .built{margin-top:10px;font-size:12px}
.blank{background:var(--surface);border-radius:16px;padding:28px;text-align:center;box-shadow:var(--shadow);margin-top:24px}

@media (max-width:720px){
  .awards{grid-template-columns:repeat(2,1fr)}
  footer ul{columns:1}
}
@media (max-width:560px){
  .lane{grid-template-columns:1fr auto;grid-template-areas:"who pts" "track track";gap:2px 8px}
  .lane .who{grid-area:who}.lane .pts{grid-area:pts}.lane .track{grid-area:track;height:40px}
  .capsid{width:46px;height:37px;margin-top:-18.5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

const COLORS = ['var(--blue)','var(--mint)','var(--coral)','var(--lightblue)'];
const PODIUM = ['var(--mint)','var(--blue)','var(--coral)'];

function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==='class') e.className=v; else if (k==='style') e.setAttribute('style',v);
    else if (k==='html') e.innerHTML=v; else e.setAttribute(k,v);
  }
  for (const k of kids.flat()){ if (k==null) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const ord = n => n + (n%100>=11&&n%100<=13 ? 'th' : ({1:'st',2:'nd',3:'rd'}[n%10]||'th'));
const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;

// A slightly unhinged AAV capsid: icosahedral shell, googly eyes, payload tail.
function capsid(color, mood){
  const mouth = mood==='sad' ? 'M27 33 q5 -4 10 0' : 'M26 31 q6 6 12 0';
  return `<svg viewBox="0 0 64 52" aria-hidden="true">
    <path class="tail" d="M10 26 q-4 -6 -8 0 q-4 6 -8 0 q-4 -6 -8 0" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
    <polygon points="32,3 52,14 52,38 32,49 12,38 12,14" fill="${color}" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M32 3 L32 16 M52 14 L42 21 M52 38 L42 31 M32 49 L32 36 M12 38 L22 31 M12 14 L22 21
             M32 16 L42 21 L42 31 L32 36 L22 31 L22 21 Z" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="25" cy="22" r="5.2" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="39" cy="22" r="5.2" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="26.5" cy="23" r="2.3" fill="#0A0A0A"/><circle cx="40.5" cy="21.5" r="2.3" fill="#0A0A0A"/>
    <path d="${mouth}" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}

function quip(p, max, first){
  if (p.total===0) return 'Still in the plasmid prep';
  if (first) return 'Crossed the BBB first';
  const f = p.total/max;
  if (f>=.75) return 'Serious tropism';
  if (f>=.5) return 'Escaped the endosome';
  if (f>=.25) return 'Packaging nicely';
  return 'Just transduced';
}

function breakdown(c){
  return [[c.chats,'chats'],[c.complete,'complete'],[c.squares,'squares'],
          [c.lines,'bingo lines'],[c.talks,'talks'],[c.words,'words']];
}

function renderMeta(conf){
  const m = document.getElementById('meta'); m.innerHTML='';
  if (D.conferences.length>1){
    const s = el('select',{'aria-label':'Conference'});
    D.conferences.forEach((c,i)=>{ const o=el('option',{value:i},c.name); if (c===conf) o.selected=true; s.append(o); });
    s.addEventListener('change',()=>{ render(D.conferences[+s.value]); try{history.replaceState(null,'','#'+encodeURIComponent(D.conferences[+s.value].name));}catch(e){} });
    m.append(s);
  } else {
    m.append(el('span',{class:'conf-name'},conf.name));
  }
  m.append(el('span',{class:'chip'},'Last updated ',el('b',{},conf.updated)));
  m.append(el('span',{class:'chip'},el('b',{},conf.participants),' participants'));
  m.append(el('span',{class:'chip'},el('b',{},conf.files),' files combined'));
}

function renderWarn(conf){
  const w = document.getElementById('warn'); w.innerHTML='';
  if (!conf.nameCheck.length) return;
  w.append(el('div',{class:'warn',role:'note'},
    el('b',{},'Check these names. '),'They look like the same person but were kept separate:',
    el('ul',{},conf.nameCheck.map(([a,b])=>el('li',{},`${a}  /  ${b}`)))));
}

function race(board, lanes){
  board.classList.add('reset'); board.classList.remove('go');
  lanes.forEach(({lane})=>lane.classList.remove('finished','racing'));
  void board.offsetWidth;
  board.classList.remove('reset'); board.classList.add('go');
  lanes.forEach(({lane,cap,f})=>{
    if (f<=0){ lane.classList.add('finished'); return; }
    lane.classList.add('racing');
    cap.addEventListener('transitionend',()=>{ lane.classList.remove('racing'); lane.classList.add('finished'); },{once:true});
  });
}

function render(conf){
  renderMeta(conf); renderWarn(conf);
  const main = document.getElementById('main'); main.innerHTML='';
  const ppl = conf.people, max = Math.max(0,...ppl.map(p=>p.total));

  // Race
  const board = el('div',{class:'board'}, el('div',{class:'bulbs','aria-hidden':'true'}));
  const lanes = ppl.map((p,i)=>{
    const color = COLORS[i%COLORS.length];
    const f = max>0 ? p.total/max : 0;
    const cap = el('div',{class:'capsid',style:`--f:${f};--dur:${1.6+(i%4)*0.25}s;--delay:${0.15+i*0.04}s`,html:capsid(color, p.total===0?'sad':'happy')});
    const track = el('div',{class:'track','aria-hidden':'true'},el('div',{class:'target'}),el('div',{class:'squirt'}),cap,el('div',{class:'finish'}));
    const lane = el('div',{class:'lane'},
      el('div',{class:'who'},el('span',{class:'r'},p.rank),el('span',{class:'n',title:p.name},p.name)),
      track, el('div',{class:'pts num'},p.total));
    board.append(lane);
    return {lane,cap,f};
  });
  board.append(el('div',{class:'bulbs bottom','aria-hidden':'true'}));
  const again = el('button',{class:'again',type:'button'},'Transfect');
  board.append(el('div',{class:'board-foot'},again));
  main.append(el('section',{'aria-label':'Race'},
    el('div',{class:'sec-head'},el('h2',{},'Live from the track'),el('p',{},'Distance = points, relative to the leader')), board));
  again.addEventListener('click',()=>race(board,lanes));

  // Podium
  const top = ppl.slice(0,3);
  const tieCount = r => ppl.filter(x=>x.rank===r).length;
  if (top.length){
    const pod = el('div',{class:'podium'});
    top.forEach((p,i)=>{
      const c = PODIUM[i];
      const k = p.counts;
      pod.append(el('div',{class:`slot p${i+1}`,style:`--c:${c}`},
        el('div',{class:'cell'},
          el('span',{class:'medal'}, (tieCount(p.rank)>1?'Tied ':'') + ord(p.rank)),
          el('div',{class:'big-capsid',html:capsid(c, p.total===0?'sad':'happy')}),
          el('div',{class:'nm'},p.name),
          el('div',{class:'total'},p.total,el('small',{},'pts'))),
        el('div',{class:'quip'},quip(p,max,i===0 && p.total>0 && tieCount(p.rank)===1)),
        el('div',{class:'bdl'}, breakdown(k).flatMap(([n,l],j)=>[j?' · ':'', el('b',{},n), ' '+(n===1?l.replace(/s$/,''):l)]))));
    });
    main.append(el('section',{'aria-label':'Podium'},el('div',{class:'sec-head'},el('h2',{},'Winners’ enclosure')),pod));
  }

  // Everyone else
  const rest = ppl.slice(3);
  const list = el('div',{class:'rest'});
  if (!rest.length) list.append(el('div',{class:'empty-note'},'Nobody else in the race yet.'));
  rest.forEach(p=>{
    const c = p.counts;
    list.append(el('div',{class:'row'+(p.total===0?' zero':'')},
      el('span',{class:'r'},p.rank),
      el('span',{class:'n',title:p.name},p.name,
        el('span',{class:'mini'},`${plural(c.chats,'chat')} (${c.complete} complete) · ${plural(c.squares,'square')} · ${plural(c.lines,'line')} · ${plural(c.talks,'talk')} · ${plural(c.words,'word')}`)),
      el('span',{class:'p num'},p.total)));
  });
  main.append(el('section',{'aria-label':'Everyone else'},el('div',{class:'sec-head'},el('h2',{},'The rest of the field'),el('p',{},'Everyone is ranked, zero included')),list));

  // Category winners
  const cats = [
    ['Most chats','Highest titer','chats','var(--mint)',v=>plural(v,'chat')],
    ['Most squares','Fullest capsid','squares','var(--lightblue)',v=>plural(v,'square')],
    ['Best note-taker','Longest payload','words','var(--coral)',v=>plural(v,'word')],
    ['Most bingo lines','Lines of best fit','lines','var(--yellow)',v=>plural(v,'line')],
  ];
  const aw = el('div',{class:'awards'});
  cats.forEach(([k,t,key,a,fmt])=>{
    const best = Math.max(0,...ppl.map(p=>p.counts[key]));
    const who = best>0 ? ppl.filter(p=>p.counts[key]===best).map(p=>p.name).join(' & ') : 'Nobody yet';
    aw.append(el('div',{class:'award',style:`--a:${a}`},el('div',{class:'ribbon','aria-hidden':'true'}),
      el('div',{class:'k'},k),el('div',{class:'t'},t),el('div',{class:'w'},who),el('div',{class:'v num'},best>0?fmt(best):'')));
  });
  main.append(el('section',{'aria-label':'Category winners'},el('div',{class:'sec-head'},el('h2',{},'Rosettes')),aw));

  if (!document.hidden && !matchMedia('(prefers-reduced-motion: reduce)').matches) race(board,lanes);
}

(function init(){
  const S = D.scoring;
  const rules = [
    `Chat logged (name or company filled): ${S.chat} pts`,
    `Complete chat (also has “what they said”): +${S.complete} pts`,
    `Bingo square ticked: ${S.square} pt each`,
    `Bingo line (row, column or diagonal): ${S.line} pts`,
    `Talk logged: ${S.talk} pts`,
    `Words written: 1 pt per ${S.words_per_point} words, max ${S.words_cap}`,
    `Every snapshot a person sent is combined, so nothing they logged is lost and repeats count once. Same total = same rank; ties ordered by complete chats, then squares.`,
    `Counts only: no contact names, companies or notes appear on this page.`,
  ];
  rules.forEach(r=>document.getElementById('rules').append(el('li',{},r)));
  document.getElementById('built').textContent = `Built ${D.built}`;
  if (!D.conferences.length){
    document.getElementById('main').append(el('div',{class:'blank'},
      el('div',{class:'big-capsid',style:'width:110px;height:90px;margin:0 auto',html:capsid('var(--blue)','sad')}),
      el('h2',{},'No riders yet'),el('p',{},'Drop passport .xlsx files into uploads/ and run python build_dashboard.py')));
    return;
  }
  let start = D.conferences[0];
  try{ const h=decodeURIComponent(location.hash.slice(1)).toLowerCase();
       start = D.conferences.find(c=>c.name.toLowerCase()===h) || start; }catch(e){}
  render(start);
})();
</script>
